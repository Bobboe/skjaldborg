<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Harder Arcade">
<meta name="theme-color" content="#0b0d10">
<meta name="description" content="Harder Arcade – spel, konto och statistik på ett ställe.">
<title>Harder Arcade</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d10;--s1:#12151a;--s2:#191d24;--s3:#222731;--line:#2a303b;--tx:#e9ecf1;--mut:#9aa3b2;--dim:#6b7484;--acc:#ffb020;--acc2:#ffcf6b;--ok:#4cc38a;--bad:#ff6b5a;
  --sa-t:env(safe-area-inset-top);--sa-b:env(safe-area-inset-bottom);--sa-l:env(safe-area-inset-left);--sa-r:env(safe-area-inset-right);--r:16px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:var(--sa-b)}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 max(16px,var(--sa-r)) 0 max(16px,var(--sa-l))}
header{position:sticky;top:0;z-index:20;background:rgba(11,13,16,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:var(--sa-t)}
.bar{display:flex;align-items:center;gap:16px;height:60px}
.logo{display:flex;align-items:center;gap:10px;font:700 18px "Space Grotesk",Inter,sans-serif;letter-spacing:-.01em}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),#ff7a1a);display:grid;place-items:center;font-style:normal;color:#1a1004;font-weight:800;font-size:14px;box-shadow:0 4px 18px rgba(255,160,32,.35)}
nav{display:flex;gap:4px;margin-left:12px}
nav a{padding:7px 12px;border-radius:9px;color:var(--mut);font-weight:600;font-size:14px}nav a:hover{color:var(--tx);background:var(--s2)}nav a.on{color:var(--tx);background:var(--s2)}
.sp{flex:1}
.acc{display:flex;align-items:center;gap:9px;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 5px;font-weight:600;font-size:14px}
.acc .av{width:28px;height:28px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--acc2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:11px 18px;font-weight:700;font-size:15px;background:var(--acc);color:#1a1004;transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
main.wrap{padding-top:28px;padding-bottom:60px}
h1{font:700 clamp(28px,4.5vw,44px)/1.1 "Space Grotesk",Inter,sans-serif;letter-spacing:-.02em;margin:0 0 8px}
h2{font:700 22px "Space Grotesk",Inter,sans-serif;margin:0 0 14px;letter-spacing:-.01em}
.lead{color:var(--mut);margin:0 0 28px;max-width:620px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.game .cov{position:relative;aspect-ratio:16/9;background:#000 center/cover no-repeat}
.game .cov::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,13,16,0) 45%,rgba(18,21,26,.95))}
.game .tag{position:absolute;left:14px;top:14px;z-index:1;background:rgba(11,13,16,.75);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.game .body{padding:4px 20px 20px;margin-top:-34px;position:relative;z-index:1;flex:1;display:flex;flex-direction:column;gap:12px}
.game h3{margin:0;font:700 24px "Space Grotesk",Inter,sans-serif}
.game p{margin:0;color:var(--mut);font-size:14px}
.prog{display:flex;gap:18px;font-size:13px;color:var(--mut)}.prog b{color:var(--tx);font-size:15px}
.pbar{height:6px;background:var(--s3);border-radius:9px;overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#ff7a1a);border-radius:9px}
.game .act{display:flex;gap:10px;margin-top:auto}
.soon .cov{background:repeating-linear-gradient(135deg,#14181e 0 14px,#171b22 14px 28px);display:grid;place-items:center}
.soon .cov span{font:700 64px "Space Grotesk",Inter,system-ui,sans-serif;color:#2a303b}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.stat small{display:block;color:var(--dim);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}.stat b{font:700 26px "Space Grotesk",Inter,system-ui,sans-serif;display:block;margin-top:2px}
.sec{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:20px}
.sechd{display:flex;align-items:center;gap:12px;margin-bottom:14px}.sechd img{width:44px;height:44px;border-radius:11px;object-fit:cover}.sechd h2{margin:0}.sechd small{color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}td{padding:9px 10px;border-bottom:1px solid #1d2129}tr:last-child td{border:0}
td.n{text-align:right;font-variant-numeric:tabular-nums}th.n{text-align:right}
.yr td{color:var(--acc2);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding-top:14px;background:transparent}
.st{color:var(--acc);letter-spacing:2px}.st .o{color:#3a404b}
.me td{background:rgba(255,176,32,.08)}
.rank{width:36px;color:var(--dim);font-weight:700}
.empty{color:var(--dim);text-align:center;padding:26px}
.note{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--mut);font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}.tabs button{background:var(--s2);border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--mut)}.tabs button.on{color:#1a1004;background:var(--acc);border-color:var(--acc)}
/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,6,8,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}.ov[hidden]{display:none}
.modal{width:min(420px,100%);background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:24px;position:relative;max-height:calc(100vh - 32px);overflow:auto}
.modal h2{margin-bottom:6px}.modal p{color:var(--mut);margin:0 0 16px;font-size:14px}
.x{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:9px;border:0;background:var(--s2);color:var(--mut);font-size:18px}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:12px 0 6px}
input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--tx);font:inherit;outline:none}input:focus{border-color:var(--acc)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:6px}.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px;font-weight:700;color:var(--mut)}.seg button.on{background:var(--s3);color:var(--tx)}
.msg{min-height:20px;font-size:13px;margin-top:10px;color:var(--mut)}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.full{width:100%;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--sa-b));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--s3);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:600;transition:.25s;z-index:60;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%)}
footer.wrap{color:var(--dim);font-size:13px;padding-top:20px;padding-bottom:40px;border-top:1px solid var(--line)}
@media (max-width:640px){nav{display:none}.bar{gap:10px}.acc span.nm{display:none}.acc{padding:5px}main.wrap{padding-top:20px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:10px 12px}.stat b{font-size:22px}.sec{padding:14px}td,th{padding:8px 6px}
  .mnav{display:flex!important}}
.mnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(18,21,26,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--sa-b))}
.mnav a{flex:1;text-align:center;padding:6px;border-radius:9px;font-size:12px;font-weight:600;color:var(--mut)}.mnav a svg{display:block;margin:0 auto 2px;width:20px;height:20px}.mnav a.on{color:var(--acc)}
@media (max-width:640px){body{padding-bottom:calc(64px + var(--sa-b))}}
</style>
</head>
<body>
<header><div class="wrap bar">
  <a class="logo" href="#/"><i>HA</i>Harder Arcade</a>
  <nav id="nav"><a href="#/" data-r="">Spel</a><a href="#/profil" data-r="profil">Min statistik</a><a href="#/topplista" data-r="topplista">Topplistor</a></nav>
  <div class="sp"></div>
  <button class="acc" id="accChip"><span class="av" id="accAv">?</span><span class="nm" id="accNm">Logga in</span></button>
</div></header>
<main class="wrap" id="view"></main>
<footer class="wrap">Harder Arcade · Harder System AB · Spelen sparas i den här webbläsaren och i ditt konto när du är inloggad.</footer>
<div class="mnav" id="mnav"><a href="#/" data-r=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="12" rx="4"/><path d="M8 11v4M6 13h4M15 12h.01M18 14h.01"/></svg>Spel</a><a href="#/profil" data-r="profil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Statistik</a><a href="#/topplista" data-r="topplista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Topplistor</a></div>

<div class="ov" id="accOv" hidden><div class="modal">
  <button class="x" id="accX" aria-label="Stäng">×</button>
  <div id="accOut">
    <h2>Ditt Harder-konto</h2><p>Ett konto för alla spel. Dina framsteg sparas och följer med mellan dina enheter.</p>
    <div class="seg"><button id="segIn" class="on">Logga in</button><button id="segUp">Skapa konto</button></div>
    <div id="nameRow" hidden><label for="fName">Spelarnamn (visas på topplistor)</label><input id="fName" maxlength="20" autocomplete="nickname"></div>
    <label for="fEmail">E-post</label><input id="fEmail" type="email" autocomplete="email">
    <label for="fPw">Lösenord</label><input id="fPw" type="password" autocomplete="current-password" minlength="6">
    <button class="btn full" id="accGo">Logga in</button>
  </div>
  <div id="accIn" hidden>
    <h2 id="accHello">Hej!</h2><p id="accMail"></p>
    <label for="fName2">Spelarnamn</label><input id="fName2" maxlength="20">
    <button class="btn full" id="accSave">Spara namn</button>
    <button class="btn ghost full" id="accOutBtn">Logga ut</button>
  </div>
  <div class="msg" id="accMsg"></div>
</div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SBCFG={"url":"https://tlskhfhwkrzcgnorvbxt.supabase.co","key":"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRsc2toZmh3a3J6Y2dub3J2Ynh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NTkyNTgsImV4cCI6MjEwOTEzNTI1OH0.wxA63qiu910CQPmvaVM9NNvE3LUt0fcS_xdZLiIAc3Y"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let sb=null,user=null,profile=null,tT=0;
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>e.classList.remove("show"),2400)}

// ---------- Spelkatalog ----------
const SKJ_CH=[["a1c1","Sommar · Fjordvägen"],["a1c2","Höst · Skogsvägen"],["a1c3","Vinter · Isfloden"],["a1c4","Vår · Bergspasset"],["a1c5","Sommar · Strandhugget"],["a1c6","Höst · Brandnätter"],["a1c7","Vinter · Fjordisen"],["a1c8","Vår · Sjökungen"],["a1c9","Sommar · Bergsvägen"],["a1c10","Höst · Vargtimmen"],["a1c11","Vinter · Midvinterblot"],["a1c12","Vår · Ulvklanens sista strid"]];
const YEARS=["År 1 · Ulvklanen vaknar","År 2 · Kusten","År 3 · Ulvaberget"];
const GAMES=[
 {id:"skjaldborg",name:"Skjaldborg",url:"/skjaldborg/",cover:"/img/skjaldborg-cover.webp",icon:"/img/skjaldborg-jarl.webp",genre:"Tower defense",
  desc:"Försvara byn mot Ulvklanen i tre år. Bygg torn, led din jarl och hird i strid och fatta val som formar berättelsen.",
  levels:SKJ_CH},
 {id:"verkstad",name:"Verkstadsbråket",url:"/verkstadsbraket/",cover:"/img/verkstad-cover.webp",genre:"Fighting · EBO-personal",locked:true,
  desc:"EBO-personalen gör upp i verkstaden. Arkadstege mot datorn eller två spelare på samma tangentbord."}
];
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
function skjLocal(){const stars={};for(const[k]of SKJ_CH){const v=+lsGet("skj_"+k)||0;if(v)stars[k]=v}
  let save=null;try{save=JSON.parse(lsGet("skj_act1")||"null")}catch(e){}return{stars,save}}
function mergeStars(a,b){const o={...a};for(const k in b)o[k]=Math.max(o[k]||0,b[k]||0);return o}
function vbStats(){let s={};try{s=JSON.parse(lsGet("vb_stats")||"{}")}catch(e){}return s}
function skjStats(){const L=skjLocal();const stars=mergeStars(L.stars,(profile&&profile.stars)||{});const done=SKJ_CH.filter(([k])=>stars[k]>0).length;const tot=Object.values(stars).reduce((a,b)=>a+b,0);
  return{stars,done,tot,save:L.save,max:SKJ_CH.length*3}}

// ---------- Konto ----------
async function initCloud(){if(!SBCFG.url||!window.supabase)return renderAcc();sb=window.supabase.createClient(SBCFG.url,SBCFG.key);
  const{data}=await sb.auth.getSession();user=data.session?data.session.user:null;if(user)await loadProfile();renderAcc();route()}
async function loadProfile(){const{data}=await sb.from("progress").select("*").eq("user_id",user.id).maybeSingle();
  if(!data){const name=(user.user_metadata&&user.user_metadata.name)||user.email.split("@")[0];const L=skjLocal();await sb.from("progress").insert({user_id:user.id,name,stars:L.stars,meta:{}});profile={name,stars:L.stars}}
  else profile=data}
const displayName=()=>profile?profile.name:(user?user.email.split("@")[0]:"");
function renderAcc(){$("accAv").textContent=user?displayName().slice(0,1).toUpperCase():"?";$("accNm").textContent=user?displayName():"Logga in"}
let signup=false;
function setSeg(up){signup=up;$("segIn").classList.toggle("on",!up);$("segUp").classList.toggle("on",up);$("nameRow").hidden=!up;$("accGo").textContent=up?"Skapa konto":"Logga in";$("fPw").autocomplete=up?"new-password":"current-password";msg("")}
function msg(t,c){const m=$("accMsg");m.textContent=t;m.className="msg"+(c?" "+c:"")}
function openAcc(){if(!sb){toast("Kontot kan inte nås just nu");return}$("accOut").hidden=!!user;$("accIn").hidden=!user;if(user){$("accHello").textContent="Hej "+displayName()+"!";$("accMail").textContent=user.email;$("fName2").value=displayName()}msg("");$("accOv").hidden=false}
$("accChip").onclick=openAcc;$("accX").onclick=()=>$("accOv").hidden=true;$("accOv").onclick=e=>{if(e.target.id==="accOv")$("accOv").hidden=true};
$("segIn").onclick=()=>setSeg(false);$("segUp").onclick=()=>setSeg(true);
$("accGo").onclick=async()=>{const email=$("fEmail").value.trim(),password=$("fPw").value,name=$("fName").value.trim().slice(0,20);
  if(!email||password.length<6)return msg("Fyll i e-post och ett lösenord på minst 6 tecken.","err");msg("Vänta…");
  const r=signup?await sb.auth.signUp({email,password,options:{data:{name:name||email.split("@")[0]}}}):await sb.auth.signInWithPassword({email,password});
  if(r.error)return msg(r.error.message.includes("Invalid login")?"Fel e-post eller lösenord.":r.error.message.includes("already")?"Det finns redan ett konto med den e-posten.":r.error.message,"err");
  if(!r.data.session)return msg("Kolla din e-post för att bekräfta kontot.","ok");
  user=r.data.session.user;await loadProfile();if(signup&&name&&profile.name!==name){await sb.from("progress").update({name}).eq("user_id",user.id);profile.name=name}
  renderAcc();$("accOv").hidden=true;toast(signup?"Kontot är skapat – välkommen!":"Inloggad som "+displayName());route()};
$("accSave").onclick=async()=>{const n=$("fName2").value.trim().slice(0,20);if(!n)return;await sb.from("progress").update({name:n}).eq("user_id",user.id);profile.name=n;renderAcc();msg("Namnet är sparat.","ok")};
$("accOutBtn").onclick=async()=>{await sb.auth.signOut();user=null;profile=null;renderAcc();$("accOv").hidden=true;toast("Utloggad");route()};

// ---------- Vyer ----------
const starStr=n=>`<span class="st">${"★".repeat(n)}<span class="o">${"★".repeat(3-n)}</span></span>`;
function viewGames(){const S=skjStats();const pct=Math.round(S.done/SKJ_CH.length*100);const cont=S.save&&S.save.ch!=null;
  return`<h1>Välkommen${user?", "+esc(displayName()):""}</h1><p class="lead">Välj ett spel. ${user?"Dina framsteg sparas i ditt konto.":"Logga in för att spara framsteg i molnet och synas på topplistorna."}</p>
  <div class="grid">${GAMES.map(g=>g.id==="verkstad"?vbCard(g):g.soon?`<div class="card game soon"><div class="cov"><span>?</span><div class="tag">${esc(g.genre)}</div></div><div class="body"><h3>${esc(g.name)}</h3><p>${esc(g.desc)}</p><div class="act"><button class="btn ghost" disabled>Kommer snart</button></div></div></div>`:
   `<div class="card game"><div class="cov" style="background-image:url(${g.cover})"><div class="tag">${esc(g.genre)}</div></div><div class="body"><h3>${esc(g.name)}</h3><p>${esc(g.desc)}</p>
    <div class="prog"><span><b>${S.done}/${SKJ_CH.length}</b> kapitel</span><span><b>${S.tot}/${S.max}</b> stjärnor</span>${cont?`<span>Nu: <b>kap ${S.save.ch+1}</b></span>`:""}</div><div class="pbar"><i style="width:${pct}%"></i></div>
    <div class="act"><a class="btn" href="${g.url}">${cont?"Fortsätt":"Spela"}</a><a class="btn ghost" href="#/profil">Statistik</a></div></div></div>`).join("")}</div>`}
function vbCard(g){const V=vbStats();const unlocked=user&&user.user_metadata&&user.user_metadata.vb;
  return`<div class="card game"><div class="cov" style="background-image:url(${g.cover})"><div class="tag">${esc(g.genre)}</div></div><div class="body"><h3>${esc(g.name)}</h3><p>${esc(g.desc)}</p>
   <div class="prog"><span><b>${V.matches||0}</b> matcher</span><span><b>${V.wins||0}</b> vinster</span><span>Bästa: <b>${(V.arcadeBest||0).toLocaleString("sv")}</b></span></div>
   <div class="act"><a class="btn" href="${g.url}">${unlocked?"Spela":"Lås upp och spela"}</a><a class="btn ghost" href="#/profil">Statistik</a></div>
   ${unlocked?"":`<p style="font-size:12px;color:var(--dim)">Kräver inloggning och EBO-koden.</p>`}</div></div>`}
async function viewProfile(){const S=skjStats();const sv=S.save||{};
  let best={},bestVB=null;if(user&&sb){const q=await sb.from("scores").select("score").eq("user_id",user.id).eq("level","vb_arcade").order("score",{ascending:false}).limit(1);bestVB=q.data&&q.data[0]?q.data[0].score:null}
  if(user&&sb){const{data}=await sb.from("scores").select("level,score,stars,created_at").eq("user_id",user.id).order("score",{ascending:false}).limit(500);for(const r of data||[])if(!best[r.level])best[r.level]=r}
  const plays=user?Object.keys(best).length:0;const sumBest=SKJ_CH.reduce((a,[k])=>a+(best[k]?best[k].score:0),0);
  return`<h1>Min statistik</h1><p class="lead">${user?"Inloggad som <b>"+esc(displayName())+"</b>.":"Du är inte inloggad – här visas det som sparats i den här webbläsaren."}</p>
  ${user?"":`<div class="note" style="margin-bottom:20px">Logga in för att se dina bästa poäng och synas på topplistorna. <button class="btn sm" onclick="openAcc()">Logga in</button></div>`}
  <div class="sec"><div class="sechd"><img src="/img/skjaldborg-jarl.webp" alt=""><div><h2>Skjaldborg</h2><small>Akt I · Klankrig</small></div><div class="sp"></div><a class="btn sm" href="/skjaldborg/">Spela</a></div>
   <div class="stats"><div class="stat"><small>Kapitel klara</small><b>${S.done}/${SKJ_CH.length}</b></div><div class="stat"><small>Stjärnor</small><b>${S.tot}/${S.max}</b></div>
    <div class="stat"><small>Jarlens nivå</small><b>${sv.jl||1}</b></div><div class="stat"><small>Fällda fiender</small><b>${(sv.kills||0).toLocaleString("sv")}</b></div>
    <div class="stat"><small>Runstenar</small><b>${(sv.story&&sv.story.runes)||0}</b></div>${user?`<div class="stat"><small>Total bästa poäng</small><b>${sumBest.toLocaleString("sv")}</b></div>`:""}</div>
   <table><thead><tr><th>Kapitel</th><th>Stjärnor</th>${user?'<th class="n">Bästa poäng</th>':""}</tr></thead><tbody>
   ${SKJ_CH.map(([k,n],i)=>(i%4===0?`<tr class="yr"><td colspan="3">${YEARS[i/4]}</td></tr>`:"")+`<tr><td>${i+1}. ${esc(n)}</td><td>${S.stars[k]?starStr(S.stars[k]):'<span style="color:var(--dim)">–</span>'}</td>${user?`<td class="n">${best[k]?best[k].score.toLocaleString("sv"):"–"}</td>`:""}</tr>`).join("")}
   </tbody></table></div>
  ${vbProfile(bestVB)}`}
const VBN={tobias:"Tobias",emil:"Emil",eric:"Eric",hydraul:"Hydraulikern",kingove:"King-Ove",lager:"Lagerchefen",butik:"Butikssäljaren",svets:"Svetsaren",montor:"Montören",admin:"Admin",falt:"Fältteknikern",larling:"Lärlingen",el:"Elektrikern",truck:"Truckföraren",chef:"Chefen"};
function vbProfile(best){const V=vbStats();const ch=Object.entries(V.chars||{}).sort((a,b)=>b[1].p-a[1].p);
  return`<div class="sec"><div class="sechd"><div style="width:44px;height:44px;border-radius:11px;background:#ffc21a;display:grid;place-items:center;color:#1a1200;font:800 20px Inter">VB</div><div><h2>Verkstadsbråket</h2><small>Fighting · EBO-personal</small></div><div class="sp"></div><a class="btn sm" href="/verkstadsbraket/">Spela</a></div>
   <div class="stats"><div class="stat"><small>Matcher</small><b>${V.matches||0}</b></div><div class="stat"><small>Vinster mot datorn</small><b>${V.wins||0}</b></div><div class="stat"><small>2-spelarmatcher</small><b>${V.vs||0}</b></div>
    <div class="stat"><small>Arkad klarad</small><b>${V.arcadeClears||0}</b></div><div class="stat"><small>Bästa arkadpoäng</small><b>${Math.max(V.arcadeBest||0,best||0).toLocaleString("sv")}</b></div></div>
   ${ch.length?`<table><thead><tr><th>Fighter</th><th class="n">Matcher</th><th class="n">Vinster</th></tr></thead><tbody>${ch.map(([id,c])=>`<tr><td>${esc(VBN[id]||id)}</td><td class="n">${c.p}</td><td class="n">${c.w}</td></tr>`).join("")}</tbody></table>`:'<div class="empty">Spela en match så visas din statistik per fighter här.</div>'}</div>`}
let lbGame="skjaldborg";let lbLevel="total";
async function viewTop(){if(!sb)return`<h1>Topplistor</h1><div class="empty">Topplistorna kan inte nås just nu.</div>`;
  const{data,error}=await sb.from("scores").select("user_id,name,level,score").order("score",{ascending:false}).limit(1000);
  if(error)return`<h1>Topplistor</h1><div class="empty">Kunde inte hämta topplistan.</div>`;
  const best={};for(const r of data){const k=r.user_id+"|"+r.level;if(!best[k]||r.score>best[k].score)best[k]=r}
  let rows;if(lbLevel==="total"){const tot={};for(const r of Object.values(best)){if(!r.level.startsWith("a1c"))continue;const t=tot[r.user_id]||(tot[r.user_id]={user_id:r.user_id,name:r.name,score:0,n:0});t.score+=r.score;t.n++;t.name=r.name}rows=Object.values(tot).sort((a,b)=>b.score-a.score)}
  else rows=Object.values(best).filter(r=>r.level===lbLevel).sort((a,b)=>b.score-a.score);
  if(lbGame==="verkstad"){rows=Object.values(best).filter(r=>r.level==="vb_arcade").sort((a,b)=>b.score-a.score)}
  rows=rows.slice(0,50);
  const gtabs=`<div class="tabs" id="gtabs"><button data-g="skjaldborg" class="${lbGame==="skjaldborg"?"on":""}">Skjaldborg</button><button data-g="verkstad" class="${lbGame==="verkstad"?"on":""}">Verkstadsbråket</button></div>`;
  if(lbGame==="verkstad")return`<h1>Topplistor</h1>${gtabs}<div class="sec"><div class="sechd"><div><h2>Verkstadsbråket</h2><small>Bästa arkadpoäng</small></div></div>${rows.length?`<table><thead><tr><th class="rank">#</th><th>Spelare</th><th class="n">Poäng</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${user&&r.user_id===user.id?"me":""}"><td class="rank">${i+1}</td><td>${esc(r.name||"Okänd")}</td><td class="n">${r.score.toLocaleString("sv")}</td></tr>`).join("")}</tbody></table>`:'<div class="empty">Ingen har satt något resultat här än.</div>'}</div>`;
  return`<h1>Topplistor</h1>${gtabs}<p class="lead">De bästa spelarna i Harder Arcade. ${user?"":"Logga in för att själv hamna här."}</p>
  <div class="sec"><div class="sechd"><img src="/img/skjaldborg-jarl.webp" alt=""><div><h2>Skjaldborg</h2><small>${lbLevel==="total"?"Summan av bästa poäng i varje kapitel":"Bästa poäng i kapitlet"}</small></div></div>
  <div class="tabs"><button data-l="total" class="${lbLevel==="total"?"on":""}">Totalt</button>${SKJ_CH.map(([k],i)=>`<button data-l="${k}" class="${lbLevel===k?"on":""}">Kap ${i+1}</button>`).join("")}</div>
  ${rows.length?`<table><thead><tr><th class="rank">#</th><th>Spelare</th>${lbLevel==="total"?'<th class="n">Kapitel</th>':""}<th class="n">Poäng</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${user&&r.user_id===user.id?"me":""}"><td class="rank">${i+1}</td><td>${esc(r.name||"Okänd viking")}</td>${lbLevel==="total"?`<td class="n">${r.n}</td>`:""}<td class="n">${r.score.toLocaleString("sv")}</td></tr>`).join("")}</tbody></table>`:'<div class="empty">Ingen har satt något resultat här än.</div>'}</div>`}
async function route(){const r=(location.hash.replace(/^#\/?/,"")||"").split("/")[0];
  for(const a of document.querySelectorAll("#nav a,#mnav a"))a.classList.toggle("on",a.dataset.r===r);
  if(r==="konto"){history.replaceState(null,"","#/");setTimeout(()=>{if(sb)openAcc();else setTimeout(()=>openAcc(),1200)},50)}
  const v=$("view");if(r==="profil"){v.innerHTML=await viewProfile()}else if(r==="topplista"){v.innerHTML=`<h1>Topplistor</h1><div class="empty">Hämtar…</div>`;v.innerHTML=await viewTop();v.querySelectorAll(".tabs button[data-l]").forEach(b=>b.onclick=()=>{lbLevel=b.dataset.l;route()});v.querySelectorAll("#gtabs button").forEach(b=>b.onclick=()=>{lbGame=b.dataset.g;route()})}else v.innerHTML=viewGames();
  window.scrollTo(0,0)}
addEventListener("hashchange",route);addEventListener("pageshow",e=>{if(e.persisted)route()});
route();initCloud();
if("serviceWorker" in navigator&&location.protocol==="https:")addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script>
